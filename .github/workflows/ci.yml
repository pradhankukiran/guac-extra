name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  video:
    name: Video library tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/guacd.Dockerfile
          target: video
          cache-from: type=gha,scope=video
          cache-to: type=gha,mode=max,scope=video

  guacd:
    name: guacd image (server unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/guacd.Dockerfile
          tags: guac-extra/guacd:ci
          cache-from: type=gha,scope=guacd
          cache-to: type=gha,mode=max,scope=guacd

  web:
    name: Web image (Java and browser tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: client
          tags: guac-extra/web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
